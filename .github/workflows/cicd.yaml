# Перша секція в файлі не обов'язкова та описує назву  Pipeline:
name: KBOT-CICD

# Визначимо подію, яка запустить виконання workflow процесу.
# on: push
on:
  push:
    branches: [ "develop", "main2" ]

permissions:
  contents: write

# блок задач який налаштовано на запуск завдання на новій ВМ з останньою версією ubuntu
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
# перший крок задачі дозволить запускати на ранері репозиторій із скриптами для виконання дії. 
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
# наступним кроком запустимо команду make test, зробимо коміт та подивимось як це працює
      - name: Run test
        run: make test
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build&Push
        env:
          APP: "kbot"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: make image push
  
  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 
    - run: echo "VERSION=v1.1.0-$(git rev-parse --short HEAD)-linux-amd64" >> $GITHUB_ENV

    - uses: mikefarah/yq@master
      with:
        cmd: yq -i '.image.tag=strenv(VERSION)' helm/values.yaml

    # --- SOPS-KMS: Fetch TELE_TOKEN from GCP Secret Manager and encrypt ---

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install SOPS
      run: |
        SOPS_VERSION=3.9.4
        curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
        chmod +x "sops-v${SOPS_VERSION}.linux.amd64"
        sudo mv "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops

    - name: Fetch TELE_TOKEN from GCP Secret Manager
      run: |
        TELE_TOKEN=$(gcloud secrets versions access latest --secret=TELE_TOKEN --project=${{ secrets.GCP_PROJECT }})
        echo "::add-mask::${TELE_TOKEN}"
        echo "TELE_TOKEN=${TELE_TOKEN}" >> $GITHUB_ENV

    - name: Generate and encrypt Kubernetes Secret with SOPS
      run: |
        # Generate plain K8s Secret manifest
        cat > flux/secret-tele-token.yaml <<EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: kbot
          namespace: kbot
        type: Opaque
        stringData:
          token: ${TELE_TOKEN}
        EOF
        # Remove leading whitespace from heredoc
        sed -i 's/^        //' flux/secret-tele-token.yaml
        # Encrypt with SOPS using GCP KMS key from .sops.yaml
        sops --encrypt --in-place \
          --encrypted-regex '^(data|stringData)$' \
          --gcp-kms "projects/${{ secrets.GCP_PROJECT }}/locations/global/keyRings/sops-flux/cryptoKeys/sops-key" \
          flux/secret-tele-token.yaml

    # --- End SOPS-KMS ---

    - run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git add .
        git commit -am "update version $VERSION"
        git push
